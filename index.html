        { id: 4, nombre: 'Corbata roja', x: 411, y: 596, w: 86, h: 103 },
        { id: 5, nombre: 'Botilito', x: 655, y: 930, w: 131, h: 310 },
        { id: 6, nombre: 'Pocillo', x: 1290, y: 1162, w: 130, h: 158 },
        { id: 7, nombre: 'Zombie', x: 1056, y: 308, w: 86, h: 103 },
        { id: 8, nombre: 'Tapabocas', x: 1628, y: 492, w: 86, h: 102 },
        { id: 9, nombre: 'Palabra “camino”', x: 1628, y: 154, w: 132, h: 158 },
        { id: 10, nombre: 'Ovni', x: 2152, y: 177, w: 86, h: 103 }
      ],
      encontrados: new Set(),
      fallos: 0,

      preparar() {
        App.setTitulo("BÚSQUEDA DE OBJETOS");
        App.mostrarTopBar(true);
        App.setInstrucciones("Arrastra para mover la escena y haz doble toque sobre cada objeto oculto.");
        this.encontrados.clear();
        this.fallos = 0;

        const area = document.getElementById('app-dynamic-area');
        area.innerHTML = `
          <div class="hw-root">
            <div class="hw-viewport" id="hw-viewport">
              <div class="hw-world" id="hw-world">
                <img class="hw-img" src="imagen/Oficina1.jpg" alt="Oficina">
              </div>
            </div>
            <div class="hw-hud"><span id="hw-score">0</span>/10 OBJETOS</div>
            <div class="hw-toast" id="hw-toast">¡Objeto encontrado!</div>
            <div class="hw-dock">
              <div class="hw-panel" id="hw-panel">
                <div class="hw-panel-inner">
                  <ul class="hw-list" id="hw-list">
                    ${this.objetos.map(o => `<li class="hw-item" id="hw-item-${o.id}"><span class="hw-name">${o.nombre}</span></li>`).join('')}
                  </ul>
                </div>
              </div>
              <button class="hw-tab" id="hw-tab">VER LISTA ▲</button>
            </div>
          </div>
        `;
        this.activarPanZoom();
      },

      arrancar() {
        App.iniciarCronometro(150, (completado) => this.finalizar(completado));
      },

      activarPanZoom() {
        const vp = document.getElementById('hw-viewport');
        const world = document.getElementById('hw-world');
        const panel = document.getElementById('hw-panel');
        const tab = document.getElementById('hw-tab');

        tab.onclick = () => panel.classList.toggle('hw-open');

        let scale = 0.65, tx = 0, ty = 0;
        let drag = false, sx = 0, sy = 0, lx = 0, ly = 0, lastTap = 0;

        const aplicar = () => { world.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${scale})`; };
        const limitar = () => {
          tx = Math.min(0, Math.max(vp.clientWidth - 2576 * scale, tx));
          ty = Math.min(0, Math.max(vp.clientHeight - 1450 * scale, ty));
        };

        tx = (vp.clientWidth - 2576 * scale) / 2;
        ty = (vp.clientHeight - 1450 * scale) / 2;
        limitar(); aplicar();

        vp.onpointerdown = (e) => { drag = true; sx = lx = e.clientX; sy = ly = e.clientY; };
        vp.onpointermove = (e) => {
          if (!drag) return;
          tx += e.clientX - lx; ty += e.clientY - ly;
          lx = e.clientX; ly = e.clientY;
          limitar(); aplicar();
        };
        vp.onpointerup = (e) => {
          drag = false;
          const ahora = Date.now();
          if (ahora - lastTap < 300) {
            const rect = vp.getBoundingClientRect();
            const wx = (e.clientX - rect.left - tx) / scale;
            const wy = (e.clientY - rect.top - ty) / scale;
            this.seleccionar(wx, wy, world);
          }
          lastTap = ahora;
        };
      },

      seleccionar(x, y, world) {
        const hit = this.objetos.find(o => x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h);
        if (hit && !this.encontrados.has(hit.id)) {
          this.encontrados.add(hit.id);
          const mk = document.createElement('div');
          mk.className = 'hw-mark';
          mk.style.left = `${hit.x}px`; mk.style.top = `${hit.y}px`;
          mk.style.width = `${hit.w}px`; mk.style.height = `${hit.h}px`;
          mk.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>`;
          world.appendChild(mk);

          document.getElementById(`hw-item-${hit.id}`).classList.add('hw-found');
          document.getElementById('hw-score').textContent = this.encontrados.size;

          const toast = document.getElementById('hw-toast');
          toast.textContent = `¡Encontraste: ${hit.nombre}!`;
          toast.classList.add('hw-show');
          setTimeout(() => toast.classList.remove('hw-show'), 1800);

          if (this.encontrados.size === this.objetos.length) this.finalizar(true);
        } else if (!hit) {
          this.fallos++;
          const miss = document.createElement('div');
          miss.className = 'hw-miss'; miss.textContent = '✕';
          miss.style.left = `${x}px`; miss.style.top = `${y}px`;
          world.appendChild(miss);
          setTimeout(() => miss.remove(), 600);
        }
      },

      finalizar(completado) {
        const puntos = completado ? 100 : (this.encontrados.size * 10);
        const usados = Math.max(1, 150 - (App.tiempoRestante || 0));
        const detalle = this.objetos.map(o => {
          const f = this.encontrados.has(o.id);
          return { q: o.nombre, tu: f ? 'Encontrado' : 'No encontrado', ok: f };
        });
        App.abrirModalResultados({
          completado,
          puntos,
          correctas: completado ? 10 : this.encontrados.size,
          incorrectas: completado ? 0 : this.fallos,
          segundosUsados: usados,
          detalle,
          onAvanzar: () => App.avanzarSiguienteBloque()
        });
      }
    };

    /* ==========================================================================
       MÓDULO 6: EL AHORCADO
       ========================================================================== */
    const ModuloBloque6 = {
      palabras: [
        { palabra: "CUANDO VAYAMOS A CUBA, VISITAMOS VARADERO", pista: "Completa la frase", pts: 100 },
        { palabra: "VAMOS A COMER TACOS Y CHILAQUILES CON AGUA DE HORCHATA", pista: "Completa la frase", pts: 70 },
        { palabra: "LA GUAYABERA NUNCA PASA DE MODA", pista: "Completa la frase", pts: 40 }
      ],
      MAX_ERRORES: 3,
      ronda: 0,
      errores: 0,
      rondaCerrada: false,
      _hist: [],
      adivinadas: new Set(),

      preparar() {
        App.setTitulo("EL AHORCADO");
        App.mostrarTopBar(true);
        App.setInstrucciones("Completa la frase antes de agotar los " + this.MAX_ERRORES + " intentos.");
        this.ronda = 0;
        this._hist = [];
        this.iniciarRondaHTML();
      },

      arrancar() {
        App.iniciarCronometro(210, () => this.procesarFallo('tiempo'));
      },

      iniciarRondaHTML() {
        this.errores = 0;
        this.rondaCerrada = false;
        this.adivinadas.clear();
        const p = this.palabras[this.ronda];

        const area = document.getElementById('app-dynamic-area');
        area.innerHTML = `
          <div class="hg-wrapper">
            <div class="hg-pista">Completa la frase</div>
            <div class="hg-badge" id="hg-badge">Intentos restantes: <span id="hg-intentos">${this.MAX_ERRORES}</span></div>
            <svg class="hg-canvas" viewBox="0 0 200 220">
              <line id="hg-p1" x1="20" y1="210" x2="120" y2="210" class="hg-part-visible" />
              <line id="hg-p2" x1="70" y1="210" x2="70" y2="20" class="hg-part-visible" />
              <line id="hg-p3" x1="70" y1="20" x2="150" y2="20" class="hg-part-visible" />
              <line id="hg-p4" x1="150" y1="20" x2="150" y2="40" class="hg-part-visible" />
              <circle id="hg-p5" cx="150" cy="60" r="20" class="hg-part-hidden" />
              <line id="hg-p6" x1="150" y1="80" x2="150" y2="140" class="hg-part-hidden" />
              <line id="hg-p7" x1="150" y1="90" x2="120" y2="120" class="hg-part-hidden" />
              <line id="hg-p8" x1="150" y1="90" x2="180" y2="120" class="hg-part-hidden" />
              <line id="hg-p9" x1="150" y1="140" x2="120" y2="185" class="hg-part-hidden" />
              <line id="hg-p10" x1="150" y1="140" x2="180" y2="185" class="hg-part-hidden" />
            </svg>
            <div class="hg-word" id="hg-word"></div>
            <div class="hg-keyboard" id="hg-keyboard"></div>
          </div>
        `;

        this.pintarLetras();
        this.pintarTeclado();
      },

      pintarLetras() {
        const c = document.getElementById('hg-word');
        c.innerHTML = '';
        const pal = this.palabras[this.ronda].palabra;
        for (let l of pal) {
          const b = document.createElement('div');
          b.className = 'hg-letter';
          const esLetra = /[A-ZÑ]/.test(l);
          if (!esLetra) { b.style.borderBottom = 'none'; b.style.width = l === ' ' ? '10px' : '12px'; }
          b.textContent = (!esLetra || this.adivinadas.has(l)) ? l : '';
          c.appendChild(b);
        }
      },

      pintarTeclado() {
        const kb = document.getElementById('hg-keyboard');
        kb.innerHTML = '';
        "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('').forEach(letra => {
          const btn = document.createElement('button');
          btn.className = 'hg-key';
          btn.textContent = letra;
          btn.onclick = () => this.probarLetra(letra, btn);
          kb.appendChild(btn);
        });
      },

      probarLetra(letra, btn) {
        if (this.rondaCerrada) return;
        btn.disabled = true;
        const pal = this.palabras[this.ronda].palabra;
        if (pal.includes(letra)) {
          this.adivinadas.add(letra);
          btn.classList.add('correct');
          this.pintarLetras();
          const gano = pal.split('').every(l => !/[A-ZÑ]/.test(l) || this.adivinadas.has(l));
          if (gano) this.finalizar(true);
        } else {
          this.errores++;
          btn.classList.add('wrong');
          // Con 3 intentos, cada error dibuja 2 partes del muñeco (cabeza+cuerpo, brazos, piernas)
          [2 * this.errores + 3, 2 * this.errores + 4].forEach(n => {
            const parte = document.getElementById(`hg-p${n}`);
            if (parte) parte.classList.replace('hg-part-hidden', 'hg-part-visible');
          });
          document.getElementById('hg-intentos').textContent = Math.max(0, this.MAX_ERRORES - this.errores);
          if (this.errores >= this.MAX_ERRORES - 1) document.getElementById('hg-badge').classList.add('peligro');
          if (this.errores >= this.MAX_ERRORES) this.procesarFallo('intentos');
        }
      },

      procesarFallo(motivo) {
        if (this.rondaCerrada) return;   // evita avanzar dos veces la misma ronda
        this.rondaCerrada = true;
        document.querySelectorAll('#hg-keyboard .hg-key').forEach(k => { k.disabled = true; });
        this._hist[this.ronda] = { ok: false, errores: this.errores, motivo: motivo || 'tiempo' };
        if (this.ronda < 2) {
          this.ronda++;
          setTimeout(() => {
            this.iniciarRondaHTML();
            App.iniciarCronometro(210, () => this.procesarFallo('tiempo'));
          }, 800);
        } else {
          this.finalizar(false);
        }
      },

      finalizar(adivino) {
        const puntos = adivino ? (this.palabras[this.ronda].pts || 100) : 0;
        const usados = Math.max(1, 210 - (App.tiempoRestante || 0));
        if (adivino) {
          this.rondaCerrada = true;
          this._hist[this.ronda] = { ok: true, errores: this.errores };
        }
        const detalle = this.palabras.map((p, i) => {
          const h = this._hist[i];
          const base = { q: `Frase ${i + 1} · vale ${p.pts} pts`, correcta: p.palabra, siempre: true, cl: 'Frase' };
          if (!h) return { ...base, tu: 'No fue necesaria (ya acertaste una frase)', ok: null };
          if (h.ok) return { ...base, tu: `Acertada (${h.errores} ${h.errores === 1 ? 'error' : 'errores'} de ${this.MAX_ERRORES})`, ok: true };
          return { ...base, tu: h.motivo === 'intentos' ? `Fallada: se agotaron los ${this.MAX_ERRORES} intentos` : 'Fallada: se agotó el tiempo', ok: false };
        });
        App.abrirModalResultados({
          detalle,
          completado: adivino,
          puntos,
          correctas: adivino ? 1 : 0,
          incorrectas: adivino ? 0 : 1,
          segundosUsados: usados,
          onAvanzar: () => App.avanzarSiguienteBloque()
        });
      }
    };

    /* ==========================================================================
       PANTALLA FINAL: PODIO Y RESUMEN GENERAL
       ========================================================================== */
    const ModuloPodio = {
      iniciar() {
        App.setTitulo("DESAFÍO COMPLETADO");
        App.mostrarTopBar(false);
        App.mostrarBotonFin(false);
        App.setInstrucciones("¡Gran trabajo en equipo! Espera los resultados oficiales del administrador.");

        const area = document.getElementById('app-dynamic-area');
        area.innerHTML = `
          <div class="podio-screen">
            <div class="podio-trofeo">🏆</div>
            <div>
              <h2 class="podio-titulo">¡FELICITACIONES!</h2>
              <div class="podio-equipo">${escHtml(App.equipo.nombre)}</div>
            </div>
            <div class="podio-total">
              <span>Puntaje Total Acumulado</span>
              <strong id="podio-total">${App.puntajeTotal} PTS</strong>
            </div>
            <p id="podio-puesto" style="font-size:0.9rem; font-weight:800; color:var(--azul-oscuro); margin:0;"></p>
            <p id="podio-sync" style="font-size:0.75rem; color:#475569; margin:0;"></p>
            <p style="font-size:0.82rem; color:#475569; margin:0;">Superaron con éxito los 6 bloques del Desafío 360.</p>
            <button class="btn-siguiente" id="btn-ver-resultados" style="animation:none;">📋 VER RESULTADOS</button>
          </div>
        `;
        document.getElementById('btn-ver-resultados').onclick = () => ResumenFinal.abrir();
        Net.actualizarSync();
        if (Net.estado) Net.actualizarPodio(Net.estado, Net.estado.equipos.find(e => e.id === Net.estado.miEquipo));
      }
    };

    /* ==========================================================================
       RESUMEN DE RESPUESTAS (pantalla aparte, se abre desde el podio)
       ========================================================================== */
    const ResumenFinal = {
      TITULOS: [null, 'Reto Video', 'Reto de Preguntas', 'Sopa de Letras', '¿Quién es el personaje?', 'Búsqueda de Objetos', 'El Ahorcado'],

      abrir() {
        this.render();
        document.getElementById('resumen-overlay').classList.add('on');
        document.getElementById('resumen-scroll').scrollTop = 0;
        document.getElementById('resumen-volver').onclick = () => this.cerrar();
      },

      cerrar() { document.getElementById('resumen-overlay').classList.remove('on'); },

      render() {
        if (!App.hist || String(App.hist.eq) !== String(App.equipo.id)) App.histCargar();
        const est = Net.estado;
        const mio = est && est.miEquipo != null ? est.equipos.find(e => e.id === est.miEquipo) : null;
        const cuenta = (items) => ({
          ok: items.filter(i => i.ok === true).length,
          mal: items.filter(i => i.ok === false).length
        });

        let totOk = 0, totMal = 0, bloquesHtml = '';
        for (let n = 1; n <= 6; n++) {
          const b = App.hist.bloques[n];
          const items = b && b.items;
          const srv = mio && mio.pts ? mio.pts[n - 1] : null;
          const pts = b ? b.puntos : (srv !== null && srv !== undefined ? srv : null);
          let cab = '';
          if (pts !== null) cab += `${pts} pts`;
          let cuerpo;
          if (items && items.length) {
            const c = cuenta(items);
            totOk += c.ok; totMal += c.mal;
            cab += ` · ✓${c.ok} ✗${c.mal}`;
            cuerpo = items.map(it => {
              const cls = it.ok === true ? 'ok' : it.ok === false ? 'mal' : 'neu';
              const ic = it.ok === true ? '✓' : it.ok === false ? '✗' : '–';
              const mostrarCor = it.correcta && (it.ok === false || it.siempre);
              return `<div class="rs-item"><span class="rs-ic ${cls}">${ic}</span><div class="rs-body">
                <div class="rs-q">${escHtml(it.q)}</div>
                ${it.tu ? `<div class="rs-tu ${cls}">${escHtml(it.tu)}</div>` : ''}
                ${mostrarCor ? `<div class="rs-cor">${escHtml(it.cl || 'Correcta')}: ${escHtml(it.correcta)}</div>` : ''}
              </div></div>`;
            }).join('');
          } else {
            cuerpo = '<div class="rs-vacio">El detalle de este bloque no está disponible en este dispositivo.</div>';
          }
          bloquesHtml += `<div class="rs-bloque">
            <div class="rs-bloque-head"><span class="t">Bloque ${n} · ${escHtml(this.TITULOS[n])}</span><span class="p">${cab}</span></div>
            ${cuerpo}</div>`;
        }

        const total = mio ? mio.total : App.puntajeTotal;
        const top = `<div class="rs-total">
          <div><div class="eq">${escHtml(App.equipo.nombre)}</div><div class="st">✓ ${totOk} correctas · ✗ ${totMal} incorrectas</div></div>
          <div class="pt">${total} pts</div></div>`;
        document.getElementById('resumen-scroll').innerHTML = top + bloquesHtml;
      }
    };

    // Arranque inicial
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
