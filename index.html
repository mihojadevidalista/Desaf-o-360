<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Desafío 360 - Máster Consolidado</title>

  <!-- Fuente Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       0. ESTILOS GLOBALES Y SHELL COMÚN (LÍNEA GRÁFICA OFICIAL)
       ========================================================================== */
    :root {
      --amarillo-institucional: #ffe601;
      --azul-oscuro: #063853;
      --gris-fondo: #ededed;
      --blanco-puro: #ffffff;
      --verde-acierto: #10b981;
      --rojo-fallo: #ef4444;
      --radio-curvo: 20px;
      --radio-boton: 50px;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;
      font-family: 'Poppins', sans-serif;
      background-color: #2b2f33;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .mobile-container {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 100dvh;
      background-color: var(--gris-fondo);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden !important;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    /* Cabecera */
    .header-franja {
      background-color: var(--amarillo-institucional);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 16px;
      height: 50px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      z-index: 5;
    }
    .header-logo {
      max-height: 40px;
      width: auto;
      max-width: 130px;
      object-fit: contain;
      display: block;
    }
    .header-titulo {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--azul-oscuro);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin: 0;
    }

    /* Contenedor principal */
    .game-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* Barra superior */
    .top-bar-container {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .timer-card {
      background-color: var(--blanco-puro);
      border-radius: var(--radio-curvo);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      box-shadow: 0 3px 8px rgba(6, 56, 83, 0.05);
    }
    .timer-icon { width: 26px; height: 26px; color: var(--azul-oscuro); flex-shrink: 0; }
    .timer-data { display: flex; flex-direction: column; line-height: 1; }
    .timer-display { font-size: 1.15rem; font-weight: 800; color: var(--azul-oscuro); }
    .timer-unit { font-size: 0.62rem; font-weight: 700; color: var(--azul-oscuro); text-align: right; letter-spacing: 1px; }

    .team-badge-header {
      background: var(--azul-oscuro);
      color: var(--amarillo-institucional);
      padding: 6px 12px;
      border-radius: var(--radio-curvo);
      font-size: 0.72rem;
      font-weight: 800;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .dynamic-area {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .instructions-card {
      flex-shrink: 0;
      text-align: center;
      font-size: 0.78rem;
      color: #334155;
      line-height: 1.25;
      padding: 4px 6px;
    }
    .instructions-card strong { color: #000; font-weight: 800; }

    /* BOTÓN FLOTANTE TEMPORAL (FINALIZAR RETO) */
    .btn-forzar-fin {
      position: absolute;
      bottom: 8px;
      right: 10px;
      z-index: 95;
      background: var(--rojo-fallo);
      color: var(--blanco-puro);
      border: 2px solid var(--blanco-puro);
      border-radius: var(--radio-boton);
      padding: 6px 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .btn-forzar-fin:active { transform: scale(0.92); }

    /* Modal de Resultados por Bloque */
    .modal-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--amarillo-institucional);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--blanco-puro);
      border: 3px solid var(--azul-oscuro);
      border-radius: 26px;
      width: 100%;
      max-width: 330px;
      padding: 20px 16px;
      margin: 0 auto;
      text-align: center;
      box-sizing: border-box;
      box-shadow: 0 12px 30px rgba(6, 56, 83, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-badge {
      background: var(--azul-oscuro);
      color: var(--amarillo-institucional);
      font-weight: 900;
      font-size: 0.85rem;
      padding: 5px 14px;
      border-radius: 20px;
      align-self: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal-score { font-size: 2.3rem; font-weight: 900; color: var(--azul-oscuro); line-height: 1; }
    .modal-score span { font-size: 0.95rem; font-weight: 700; color: #64748b; }
    .modal-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-box {
      background: var(--gris-fondo);
      border-radius: 14px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .metric-box.full-width { grid-column: span 2; }
    .metric-value { font-size: 1.15rem; font-weight: 800; line-height: 1.1; }
    .metric-label { font-size: 0.68rem; font-weight: 600; color: #64748b; margin-top: 2px; text-transform: uppercase; }
    .metric-box.correct .metric-value { color: var(--verde-acierto); }
    .metric-box.wrong .metric-value { color: var(--rojo-fallo); }
    .metric-box.time .metric-value { color: var(--azul-oscuro); }

    .btn-siguiente {
      width: 100%;
      background-color: var(--azul-oscuro);
      color: var(--amarillo-institucional);
      border: none;
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: var(--radio-boton);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(6, 56, 83, 0.3);
      animation: pulsoEscala 2s infinite ease-in-out;
    }
    @keyframes pulsoEscala { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .btn-siguiente:active { transform: scale(0.96) !important; }

    /* Cortina / Intro de bloque animada (universal) */
    .ib-overlay {
      position: absolute;
      inset: 0;
      z-index: 300;
      background: var(--azul-oscuro);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .ib-overlay.ib-salida { opacity: 0; transform: scale(1.12); pointer-events: none; }
    .ib-fondo {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 230, 1, 0.22) 0%, rgba(255, 230, 1, 0) 55%),
        radial-gradient(circle at 15% 90%, rgba(255, 230, 1, 0.12) 0%, rgba(255, 230, 1, 0) 40%);
      animation: ibRespira 3s ease-in-out infinite;
    }
    @keyframes ibRespira { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    .ib-onda {
      position: absolute;
      left: 50%;
      top: 45%;
      width: 40%;
      aspect-ratio: 1 / 1;
      border: 3px solid var(--amarillo-institucional);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0;
      animation: ibOnda 2.4s ease-out infinite;
    }
    .ib-onda:nth-child(2) { animation-delay: 0.8s; }
    .ib-onda:nth-child(3) { animation-delay: 1.6s; }
    @keyframes ibOnda {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
    }
    .ib-punto {
      position: absolute;
      border-radius: 50%;
      background: var(--amarillo-institucional);
      opacity: 0;
      animation: ibFlota 3.2s ease-in-out infinite;
    }
    @keyframes ibFlota {
      0% { transform: translateY(30px) scale(0.5); opacity: 0; }
      30% { opacity: 0.85; }
      100% { transform: translateY(-90px) scale(1.1); opacity: 0; }
    }
    .ib-contenido {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }
    .ib-etiqueta {
      color: var(--amarillo-institucional);
      font-weight: 800;
      font-size: clamp(1rem, 5.4vw, 1.5rem);
      letter-spacing: 0.5em;
      margin-right: -0.5em;
      text-transform: uppercase;
      opacity: 0;
      animation: ibSubir 0.6s ease 0.2s forwards;
    }
    .ib-numero {
      font-weight: 900;
      font-size: clamp(5.5rem, 36vw, 10rem);
      line-height: 1;
      color: var(--blanco-puro);
      text-shadow: 6px 6px 0 var(--amarillo-institucional);
      margin: 4px 0 2px;
      opacity: 0;
      transform: scale(0) rotate(-18deg);
      animation: ibRebote 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
    }
    .ib-linea {
      height: 5px;
      width: 0;
      border-radius: 5px;
      background: var(--amarillo-institucional);
      margin-bottom: 16px;
      animation: ibLinea 0.7s ease 1.1s forwards;
    }
    .ib-titulo {
      background: var(--amarillo-institucional);
      color: var(--azul-oscuro);
      font-weight: 900;
      font-size: clamp(1rem, 6vw, 1.6rem);
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 24px;
      border-radius: var(--radio-boton);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
      opacity: 0;
      animation: ibSubir 0.7s ease 1.3s forwards;
    }
    @keyframes ibSubir { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ibRebote { to { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes ibLinea { to { width: 60%; } }

    /* ==========================================================================
       1. ESTILOS MÓDULO: MENÚ DE INICIO
       ========================================================================== */
    .menu-screen {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
      background: var(--blanco-puro); border-radius: 26px;
    }
    .menu-wrapper { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 22px; }
    .caja-desplegable { position: relative; width: 100%; z-index: 20; }
    .select-institucional {
      width: 100%; padding: 15px 18px; font-size: 0.95rem; font-weight: 600;
      color: var(--azul-oscuro); background-color: var(--gris-fondo);
      border: 2px solid transparent; border-radius: 16px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
    }
    .caja-desplegable.active .select-institucional {
      border-color: var(--azul-oscuro); background-color: var(--blanco-puro);
      border-bottom-left-radius: 4px; border-bottom-right-radius: 4px;
    }
    .arrow { width: 10px; height: 10px; border-right: 3px solid var(--azul-oscuro); border-bottom: 3px solid var(--azul-oscuro); transform: translateY(-20%) rotate(45deg); transition: transform 0.3s; }
    .caja-desplegable.active .arrow { transform: translateY(20%) rotate(225deg); }
    .select-options {
      position: absolute; top: calc(100% + 4px); left: 0; width: 100%;
      background: var(--blanco-puro); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-height: 200px; overflow-y: auto; margin: 0; padding: 6px 0; list-style: none;
      box-sizing: border-box; visibility: hidden; opacity: 0; pointer-events: none; transition: 0.25s;
    }
    .caja-desplegable.active .select-options { visibility: visible; opacity: 1; pointer-events: auto; }
    .select-options li { padding: 10px 16px; font-size: 0.9rem; font-weight: 600; color: var(--azul-oscuro); cursor: pointer; }
    .select-options li:hover { background-color: var(--gris-fondo); }
    .error-shake { animation: shake 0.4s both; border-color: #ef4444 !important; }
    @keyframes shake { 10%, 90% { transform: translate3d(-2px,0,0); } 30%, 70% { transform: translate3d(-4px,0,0); } 40%, 60% { transform: translate3d(4px,0,0); } }

    /* ==========================================================================
       2. ESTILOS MÓDULO: BLOQUE 1 (RETO VIDEO)
       ========================================================================== */
    .rt-root { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .rt-wait {
      flex: 1; background: var(--blanco-puro); border-radius: var(--radio-curvo);
      box-shadow: 0 3px 8px rgba(6,56,83,0.05); display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; padding: 12px 14px; text-align: center; box-sizing: border-box;
    }
    .rt-wait-badge {
      background: var(--azul-oscuro); color: var(--amarillo-institucional); font-weight: 800;
      font-size: clamp(0.85rem, 4.6vw, 1.2rem); padding: 8px 16px; border-radius: 30px;
      display: flex; align-items: center; gap: 8px; text-transform: uppercase;
    }
    .rt-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rojo-fallo); animation: rtParpadeo 1.2s infinite; }
    @keyframes rtParpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .rt-ring-wrap { flex: 1; width: 100%; position: relative; container-type: size; }
    .rt-ring { position: absolute; left: 50%; top: 50%; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); transform: translate(-50%, -50%); }
    .rt-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .rt-ring-bg { fill: none; stroke: var(--gris-fondo); stroke-width: 10; }
    .rt-ring-fg { fill: none; stroke: var(--azul-oscuro); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 339.292; stroke-dashoffset: 0; transition: stroke-dashoffset 0.3s linear; }
    .rt-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .rt-big-time { font-size: clamp(1.4rem, 21cqmin, 3.2rem); font-weight: 900; color: var(--azul-oscuro); }
    .rt-big-label { font-size: 0.65rem; font-weight: 700; color: #64748b; letter-spacing: 1px; text-transform: uppercase; }
    .rt-wait-title { font-size: 1.05rem; font-weight: 800; color: var(--azul-oscuro); margin: 0; }
    .rt-wait-text { font-size: 0.78rem; color: #475569; margin: 0; max-width: 290px; }
    .rt-lock { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; color: var(--azul-oscuro); background: var(--gris-fondo); border-radius: 20px; padding: 6px 12px; }

    .rt-quiz { flex: 1; display: flex; flex-direction: column; gap: 8px; animation: rtEntrada 0.4s ease; }
    @keyframes rtEntrada { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .rt-progress { display: flex; flex-direction: column; gap: 4px; }
    .rt-progress-top { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 800; color: var(--azul-oscuro); text-transform: uppercase; }
    .rt-progress-bar { height: 7px; border-radius: 7px; background: rgba(6, 56, 83, 0.15); overflow: hidden; }
    .rt-progress-fill { height: 100%; width: 0; background: var(--azul-oscuro); border-radius: 7px; transition: width 0.3s ease; }
    .rt-body { flex: 1; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
    .rt-question { background: var(--azul-oscuro); color: var(--blanco-puro); border-radius: var(--radio-curvo); padding: 11px 13px; font-size: 0.88rem; font-weight: 700; line-height: 1.3; }
    .rt-option {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: var(--blanco-puro); border: 2px solid transparent; border-radius: 14px;
      padding: 7px 10px; cursor: pointer; font-family: inherit; box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }
    .rt-option.selected { border-color: var(--azul-oscuro); background: #fffbd1; }
    .rt-letter { width: 26px; height: 26px; border-radius: 50%; background: var(--gris-fondo); color: var(--azul-oscuro); font-weight: 900; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; }
    .rt-option.selected .rt-letter { background: var(--azul-oscuro); color: var(--amarillo-institucional); }
    .rt-text { font-size: 0.8rem; font-weight: 600; color: #334155; }
    .rt-option:disabled { cursor: default; }
    .rt-option.correct { background: var(--verde-acierto); border-color: var(--verde-acierto); }
    .rt-option.correct .rt-text { color: #fff; }
    .rt-option.correct .rt-letter { background: #fff; color: var(--verde-acierto); }
    .rt-option.wrong { background: var(--rojo-fallo); border-color: var(--rojo-fallo); }
    .rt-option.wrong .rt-text { color: #fff; }
    .rt-option.wrong .rt-letter { background: #fff; color: var(--rojo-fallo); }
    .rt-nav { display: flex; gap: 8px; }
    .rt-btn-prev { width: 44px; border: none; border-radius: var(--radio-boton); background: var(--blanco-puro); color: var(--azul-oscuro); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .rt-btn-next { flex: 1; border: none; border-radius: var(--radio-boton); background: var(--azul-oscuro); color: var(--amarillo-institucional); font-family: inherit; font-weight: 800; font-size: 0.92rem; padding: 11px 16px; cursor: pointer; }
    .rt-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ==========================================================================
       3. ESTILOS MÓDULO: BLOQUE 2 (RETO PREGUNTAS)
       ========================================================================== */
    .b2-quiz { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .b2-question { text-align: center; font-size: 1rem; font-weight: 800; color: var(--azul-oscuro); background: var(--blanco-puro); padding: 16px 14px; border-radius: var(--radio-curvo); box-shadow: 0 3px 8px rgba(0,0,0,0.05); margin: 0; }
    .b2-options { display: flex; flex-direction: column; gap: 8px; }
    .b2-opt-btn { background: var(--blanco-puro); color: var(--azul-oscuro); border: 2px solid rgba(6,56,83,0.1); border-radius: 12px; padding: 10px 14px; font-family: inherit; font-size: 0.88rem; font-weight: 600; text-align: left; cursor: pointer; }
    .b2-opt-btn.correct { background-color: var(--verde-acierto) !important; color: #fff !important; border-color: var(--verde-acierto); }
    .b2-opt-btn.wrong { background-color: var(--rojo-fallo) !important; color: #fff !important; border-color: var(--rojo-fallo); }

    /* ==========================================================================
       4. ESTILOS MÓDULO: BLOQUE 3 (SOPA DE LETRAS)
       ========================================================================== */
    .ws-progress { width: 100%; background: var(--blanco-puro); border-radius: 12px; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; }
    .ws-text { font-size: 0.82rem; font-weight: 800; color: var(--azul-oscuro); text-align: center; }
    .ws-track { width: 100%; height: 8px; background: var(--gris-fondo); border-radius: 8px; overflow: hidden; }
    .ws-fill { height: 100%; width: 0%; background: var(--verde-acierto); transition: width 0.3s; }
    #word-search-grid { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; background-color: #000; padding: 5px; border-radius: 12px; width: 100%; max-width: 375px; touch-action: none; margin: auto; }
    .ws-cell { background-color: var(--blanco-puro); color: var(--azul-oscuro); font-weight: 800; font-size: 0.85rem; display: flex; justify-content: center; align-items: center; border-radius: 3px; aspect-ratio: 1; user-select: none; }
    .ws-cell.selected { background-color: var(--amarillo-institucional); }
    .ws-cell.found { background-color: var(--verde-acierto); color: #fff; }
    .ws-cell.missed { background-color: var(--rojo-fallo); color: #fff; }

    /* ==========================================================================
       5. ESTILOS MÓDULO: BLOQUE 4 (RETO PERSONAJE - VIDEO)
       ========================================================================== */
    .rv-player { background: var(--azul-oscuro); border-radius: var(--radio-curvo); padding: 7px 12px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .rv-player-top { display: flex; align-items: center; justify-content: center; gap: 14px; }

    /* ==========================================================================

    /* ==========================================================================

    /* ==========================================================================
       8. PANTALLA FINAL PODIO / RESUMEN
       ========================================================================== */
    .podio-screen {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; padding: 20px 14px; box-sizing: border-box;

    .podio-total strong { font-size: 2.6rem; font-weight: 900; color: var(--azul-oscuro); line-height: 1; }
  
    /* ---- Tiempo real: pausa, conexión y lobby ---- */
    .pausa-overlay { position:absolute; inset:0; z-index:500; background:rgba(6,56,83,0.97); color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:14px; }

    .select-options li.ocupado { opacity:0.45; cursor:not-allowed; text-decoration:line-through; }
    .select-options li.ocupado::after { content:' 🔒'; text-decoration:none; display:inline-block; }
    .select-institucional.bloqueado { pointer-events:none; }
    .btn-siguiente:disabled { cursor:default; }

    /* ---- Resumen de respuestas (pantalla aparte del anuncio final) ---- */
    .resumen-overlay { position:absolute; inset:0; z-index:150; background:var(--gris-fondo); display:none; flex-direction:column; }
    .resumen-overlay.on { display:flex; }

    .resumen-volver { background:var(--amarillo-institucional); color:var(--azul-oscuro); border:none; border-radius:var(--radio-boton); padding:6px 14px; font-family:'Poppins',sans-serif; font-size:0.72rem; font-weight:800; cursor:pointer; }
    .resumen-scroll { flex:1; min-height:0; overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:12px 12px 28px; display:flex; flex-direction:column; gap:12px; }
    .rs-total { background:#fff; border:3px solid var(--azul-oscuro); border-radius:var(--radio-curvo); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .rs-total .eq { font-size:0.82rem; font-weight:800; color:var(--azul-oscuro); text-transform:uppercase; }
    .rs-total .st { font-size:0.7rem; font-weight:700; color:#64748b; margin-top:2px; }
    .rs-total .pt { font-size:1.6rem; font-weight:900; color:var(--azul-oscuro); line-height:1; white-space:nowrap; }

    .rs-bloque-head .t { font-size:0.74rem; font-weight:900; text-transform:uppercase; }
    .rs-bloque-head .p { font-size:0.7rem; font-weight:800; white-space:nowrap; }

    .rs-ic.ok { background:var(--verde-acierto); } .rs-ic.mal { background:var(--rojo-fallo); } .rs-ic.neu { background:#94a3b8; }

    .rs-cor { margin-top:2px; font-weight:600; color:#047857; }

<body>

  <main class="mobile-container">
    <!-- Header compartido -->
    <header class="header-franja">
      <img src="imagen/logo.png" alt="Logo" class="header-logo" onerror="this.src='https://placehold.co/120x40/ffe601/063853?text=Logo'">
      <h1 class="header-titulo" id="app-header-titulo">DESAFÍO 360</h1>
    </header>

    <!-- Contenido dinámico común -->
    <section class="game-content" id="app-game-content">
      <!-- Barra superior con Cronómetro y Equipo -->
      <div class="top-bar-container" id="app-top-bar" style="display: none;">
        <div class="timer-card">
          <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"></circle>
            <path d="M12 9v4l2.5 1.5"></path><path d="M10 2h4"></path><path d="M12 2v3"></path>
          </svg>
          <div class="timer-data">
            <div class="timer-display"><span id="app-timer-text">00:00</span></div>
            <span class="timer-unit">MIN</span>
          </div>
        </div>

      <!-- Área de inyección de cada juego -->
      <div class="dynamic-area" id="app-dynamic-area"></div>

      <!-- Tarjeta de instrucciones inferior -->

        <p id="app-instructions-text">Selecciona tu equipo para comenzar la competencia.</p>

      <!-- BOTÓN FLOTANTE TEMPORAL PARA FINALIZAR/SALTAR BLOQUE (solo con MODO_PRUEBAS = true) -->

        ⚡ FINALIZAR RETO
      </button>

    <div class="net-banner" id="net-banner">Sin conexión con el servidor… reintentando</div>
    <div class="pausa-overlay" id="pausa-overlay">
      <div class="pausa-ic" id="pausa-ic">⏸</div>

    <div class="resumen-overlay" id="resumen-overlay">

          SIGUIENTE
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

  <script>
    /* ==========================================================================
       ORQUESTADOR CENTRAL (MOTOR DEL DESAFÍO 360)
       ========================================================================== */
    /* Interruptor del botón de prueba "FINALIZAR RETO".
       true  = visible (pruebas) · false = oculto (evento real) */
    const MODO_PRUEBAS = false;

    const App = {
      equipo: { id: '', nombre: '' },
      puntajeTotal: 0,
      bloqueActual: 0, // 0 = Menú, 1..6 = Bloques, 7 = Podio final
      
      tiempoRestante: 0,
      tiempoInicial: 0,
      timerInterval: null,
      cronometroActivo: false,

      pausado: false,

      /* Historial de respuestas por bloque (para la pantalla de resumen final).
         Se guarda en el dispositivo para sobrevivir a recargas. */
      hist: null,

      histCargar() {
        try {
          const h = JSON.parse(Net.leer('d360_hist') || 'null');
          if (h && String(h.eq) === String(this.equipo.id) && h.bloques) { this.hist = h; return; }
        } catch (e) {}
        this.hist = { eq: String(this.equipo.id), bloques: {} };
      },

      registrarBloque(n, datos) {
        if (!this.hist || String(this.hist.eq) !== String(this.equipo.id)) this.histCargar();
        this.hist.bloques[n] = datos;
        Net.guardar('d360_hist', JSON.stringify(this.hist));
      },

      init() {
        this.bloqueActual = 0;
        this.puntajeTotal = 0;
        Net.arrancar();
      },

      /* Pausa global: congela interfaz, cronómetros y audio/video */
      setPausa(on, titulo, texto, icono) {
        const ov = document.getElementById('pausa-overlay');
        if (on) {
          if (titulo) document.getElementById('pausa-titulo').textContent = titulo;
          if (texto) document.getElementById('pausa-texto').textContent = texto;
          if (icono) document.getElementById('pausa-ic').textContent = icono;
        }
        if (on === this.pausado) return;
        this.pausado = on;
        ov.classList.toggle('on', on);
        document.querySelectorAll('audio, video').forEach(m => {
          if (on) { if (!m.paused) { m.dataset.d360 = '1'; m.pause(); } }
          else if (m.dataset.d360) { delete m.dataset.d360; m.play().catch(() => {}); }
        });
      },

      setTitulo(txt) {
        document.getElementById('app-header-titulo').textContent = txt;
      },

      setInstrucciones(html) {
        document.getElementById('app-instructions-text').innerHTML = html;
      },

      mostrarTopBar(visible) {
        document.getElementById('app-top-bar').style.display = visible ? 'flex' : 'none';
        if (visible && this.equipo.nombre) {
          document.getElementById('app-team-badge').textContent = this.equipo.nombre;
        }
      },

      mostrarBotonFin(visible) {
        const btn = document.getElementById('btn-forzar-fin');
        if (!btn) return;
        if (MODO_PRUEBAS && visible && this.bloqueActual >= 1 && this.bloqueActual <= 5) {
          btn.style.display = 'flex';
          btn.onclick = () => this.forzarFinBloqueActual();
        } else {
          btn.style.display = 'none';
        }
      },

      forzarFinBloqueActual() {
        if (this.bloqueActual === 1) ModuloBloque1.finalizar(true);
        else if (this.bloqueActual === 2) ModuloBloque2.finalizar(true);
        else if (this.bloqueActual === 3) ModuloBloque3.finalizar(true);
        else if (this.bloqueActual === 4) ModuloBloque4.finalizar(true);
        else if (this.bloqueActual === 5) ModuloBloque5.finalizar(true);
        else if (this.bloqueActual === 6) ModuloBloque6.finalizar(true);
      },

      formatearTiempo(segundos) {
        const min = Math.floor(segundos / 60);
        const sec = segundos % 60;
        return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
      },

      iniciarCronometro(segundos, onTerminar) {
        clearInterval(this.timerInterval);
        this.tiempoInicial = segundos;
        this.tiempoRestante = segundos;
        this.cronometroActivo = true;
        const el = document.getElementById('app-timer-text');
        el.textContent = this.formatearTiempo(this.tiempoRestante);

        this.timerInterval = setInterval(() => {
          if (this.pausado) return;
          this.tiempoRestante--;
          el.textContent = this.formatearTiempo(this.tiempoRestante);
          if (this.tiempoRestante <= 0) {
            clearInterval(this.timerInterval);
            this.cronometroActivo = false;
            if (typeof onTerminar === 'function') onTerminar(false);
          }
        }, 1000);
      },

      detenerCronometro() {
        clearInterval(this.timerInterval);
        this.cronometroActivo = false;
      },

      /* CORTINA DE INTRO SIN PARPADEO */
      mostrarIntro(numero, titulo, onTerminar) {
        const cont = document.querySelector('.mobile-container') || document.body;
        const ov = document.createElement('div');
        ov.className = 'ib-overlay';
        ov.innerHTML = `
          <div class="ib-fondo"></div>
          <div class="ib-onda"></div><div class="ib-onda"></div><div class="ib-onda"></div>
          <div class="ib-contenido">
            <div class="ib-etiqueta">Bloque</div>
            <div class="ib-numero">${numero}</div>
            <div class="ib-linea"></div>
            <div class="ib-titulo">${titulo}</div>
          </div>
        `;
        cont.appendChild(ov);

        // Desvanecimiento suave
        setTimeout(() => ov.classList.add('ib-salida'), 3000);
        setTimeout(() => {
          if (ov.parentNode) ov.parentNode.removeChild(ov);
          if (typeof onTerminar === 'function') onTerminar();
        }, 3700);
      },

      abrirModalResultados({ completado, puntos, correctas, incorrectas, segundosUsados, detalle, onAvanzar }) {
        this.detenerCronometro();
        this.mostrarBotonFin(false);
        this.puntajeTotal += Math.round(puntos);
        this.registrarBloque(this.bloqueActual, { puntos: Math.round(puntos), segundos: segundosUsados, completado: !!completado, items: detalle || null });
        Net.reportar(this.bloqueActual, Math.round(puntos), segundosUsados);

        document.getElementById('modal-badge-texto').textContent = completado ? "RETO COMPLETADO" : "TIEMPO AGOTADO";
        document.getElementById('resumen-puntaje').innerHTML = `${Math.round(puntos)} <span>pts</span>`;
        document.getElementById('resumen-correctas').textContent = correctas;
        document.getElementById('resumen-incorrectas').textContent = incorrectas;
        document.getElementById('resumen-tiempo').textContent = `${this.formatearTiempo(segundosUsados)} MIN`;

        const modal = document.getElementById('modal-resultados');
        const btn = document.getElementById('btn-modal-siguiente');
        modal.classList.add('active');

        btn.onclick = () => {
          modal.classList.remove('active');
          if (typeof onAvanzar === 'function') onAvanzar();
        };
      },

      /* TRANSICIÓN CORREGIDA: MONTA EL BLOQUE DETRÁS DE LA CORTINA INMEDIATAMENTE */
      avanzarSiguienteBloque() {
        this.bloqueActual++;
        // salta los retos que el servidor ya tiene registrados (p. ej. tras un reenvío del admin)
        while (this.bloqueActual >= 1 && this.bloqueActual <= 6 && Net.retoRegistrado(this.bloqueActual)) this.bloqueActual++;
        this.detenerCronometro();

        if (this.bloqueActual >= 1 && this.bloqueActual <= 6) {
          const cfg = [
            null,
            { num: 1, titulo: "RETO VIDEO", modulo: ModuloBloque1 },
            { num: 2, titulo: "RETO DE PREGUNTAS", modulo: ModuloBloque2 },
            { num: 3, titulo: "SOPA DE LETRAS", modulo: ModuloBloque3 },
            { num: 4, titulo: "¿QUIÉN ES EL PERSONAJE?", modulo: ModuloBloque4 },
            { num: 5, titulo: "BÚSQUEDA DE OBJETOS", modulo: ModuloBloque5 },
            { num: 6, titulo: "EL AHORCADO", modulo: ModuloBloque6 }
          ][this.bloqueActual];

          // 1. Lanza la cortina animada (z-index 300, 100% opaca)
          this.mostrarIntro(cfg.num, cfg.titulo, () => {
            // Cuando la cortina termina de desvanecerse, activa el reloj/interacción
            this.mostrarBotonFin(true);
            cfg.modulo.arrancar();
          });

          // 2. Monta el nuevo bloque DETRÁS de la cortina DE INMEDIATO
          // Al desvanecerse la cortina, JAMÁS se ve el bloque anterior
          cfg.modulo.preparar();
        } else {
          ModuloPodio.iniciar();
        }
      }
    };

    /* ==========================================================================
       CONEXIÓN EN TIEMPO REAL (Google Apps Script + Google Sheets)
       El servidor es la fuente única de verdad: estado, reloj, grupos y puntajes.
       ========================================================================== */
    const escHtml = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const Net = {
      URL: 'https://script.google.com/macros/s/AKfycbx3aC96Xlgk00uxsN3gpkSXfVp4CuWnQ_GDLDCcuYnGqDmondAY-1mpY84BhjQBfMps/exec',
      POLL_MS: 2000,
      RETRASO_INICIO_MS: 5000,   // todos los equipos arrancan en t0 + 5 s (hora del servidor)
      token: null,
      estado: null,
      offset: 0,                 // hora servidor - hora local
      cola: [],
      enviando: false,
      ocupadoTick: false,
      iniciado: false,
      jugando: false,
      esperandoInicio: false,
      eligioEn: 0,
      _mem: {},

      guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) { this._mem[k] = v; } },
      leer(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return this._mem[k] || null; },
      borrar(k) { try { localStorage.removeItem(k); } catch (e) {} delete this._mem[k]; },

      obtenerToken() {
        let t = this.leer('d360_token');
        if (!t) {
          try { t = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join(''); }
          catch (e) { t = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + Date.now().toString(36)).padEnd(24, 'x'); }
          this.guardar('d360_token', t);
        }
        return t;
      },

      async api(params) {
        const qs = new URLSearchParams(params).toString();
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 10000);
        try {
          const r = await fetch(this.URL + '?' + qs, { signal: ctl.signal, cache: 'no-store' });
          return await r.json();
        } finally { clearTimeout(to); }
      },

      mostrarConectando(msg) {
        App.setTitulo('DESAFÍO 360');
        App.mostrarTopBar(false);
        App.setInstrucciones('Conectando con el servidor…');
        document.getElementById('app-dynamic-area').innerHTML =
          '<div style="text-align:center;font-weight:800;color:var(--azul-oscuro);padding:20px;">' + escHtml(msg) + '</div>';
      },

      async arrancar() {
        this.token = this.obtenerToken();
        try { this.cola = JSON.parse(this.leer('d360_cola') || '[]'); } catch (e) { this.cola = []; }
        this.mostrarConectando('Conectando con el servidor…');
        await this.flush();          // reenvía puntajes pendientes antes de restaurar la sesión
        await this.tick();
        setInterval(() => this.tick(), this.POLL_MS);
      },

      setOnline(on) {
        const b = document.getElementById('net-banner');
        if (b) b.classList.toggle('on', !on);
      },

      async tick() {
        if (this.ocupadoTick) return;
        this.ocupadoTick = true;
        const t0 = Date.now();
        try {
          const s = await this.api({ accion: 'estado', token: this.token });
          const t1 = Date.now();
          if (!s || !s.ok) throw new Error((s && s.error) || 'Error de servidor');
          this.offset = s.serverNow - (t0 + t1) / 2;
          this.setOnline(true);
          this.estado = s;
          this.procesar(s);
          this.flush();
        } catch (e) {
          this.setOnline(false);
          if (!this.iniciado) this.mostrarConectando('No se pudo conectar. Reintentando…');
        } finally { this.ocupadoTick = false; }
      },

      procesar(s) {
        // Expulsado por el administrador: pantalla de salida y se detiene todo
        if (s.expulsado) {
          if (!this.expulsado) {
            this.expulsado = true;
            this.cola = []; this.guardarCola();
            App.detenerCronometro();
            App.setPausa(true, 'Fuera de la competencia', 'El administrador retiró a tu equipo de la competencia.', '🚫');
          }
          return;
        }
        if (this.expulsado) { location.reload(); return; }   // fue readmitido

        const mio = s.miEquipo != null ? s.equipos.find(e => e.id === s.miEquipo) : null;

        // Sesión perdida: el admin reinició o liberó este grupo
        if (this.iniciado && App.equipo.id && !mio && (Date.now() - this.eligioEn) > 8000) {
          this.borrar('d360_cola');
          location.reload();
          return;
        }

        // El admin envió a este grupo a otro reto: se recarga y retoma donde le corresponde
        if (mio) {
          if (this.movVisto === undefined) this.movVisto = mio.mov || 0;
          else if ((mio.mov || 0) !== this.movVisto) { this.borrar('d360_cola'); location.reload(); return; }
        }

        if (!this.iniciado) { this.iniciado = true; this.montarInicial(s, mio); }

        if (mio) {
          App.equipo.nombre = mio.nombre;
          const badge = document.getElementById('app-team-badge');
          if (badge) badge.textContent = mio.nombre;
        }

        this.aplicarEstadoGlobal(s, mio);
        if (ModuloMenu.montado) ModuloMenu.refrescar(s);
        if (!this.jugando && App.equipo.id && (s.estado === 'en_curso' || s.estado === 'pausada')) this.programarInicio(s);
        // Podio en pantalla pero el servidor aún le tiene retos pendientes: vuelve a jugarlos
        if (App.bloqueActual >= 7 && mio && !mio.terminado && mio.bloque >= 1 && mio.bloque <= 6 &&
            !this.cola.length && !this.enviando && (s.estado === 'en_curso' || s.estado === 'pausada')) {
          this.pendCont = (this.pendCont || 0) + 1;
          if (this.pendCont >= 3) { location.reload(); return; }
        } else this.pendCont = 0;
        this.actualizarPodio(s, mio);
      },

      retoRegistrado(n) {
        const s = this.estado;
        if (!s || s.miEquipo == null) return false;
        const e = s.equipos.find(x => x.id === s.miEquipo);
        return !!(e && e.pts && e.pts[n - 1] !== null && e.pts[n - 1] !== undefined);
      },

      montarInicial(s, mio) {
        if (mio) {
          App.equipo = { id: String(mio.id), nombre: mio.nombre };
          App.puntajeTotal = mio.total;
          if (mio.terminado || mio.bloque > 6) {
            this.jugando = true; App.bloqueActual = 7; ModuloPodio.iniciar(); return;
          }
          if (s.estado === 'en_curso' || s.estado === 'pausada') {
            this.jugando = true;
            App.bloqueActual = Math.max(1, mio.bloque) - 1;   // retoma en el bloque en que iba
            App.avanzarSiguienteBloque();
            return;
          }
        }
        ModuloMenu.mount();
      },

      aplicarEstadoGlobal(s, mio) {
        if (s.estado === 'pausada') {
          App.setPausa(true, 'Juego en pausa', 'El administrador pausó la competencia. Espera a que se reanude.', '⏸');
        } else if (s.estado === 'finalizada' && !(mio && mio.terminado)) {
          const pts = mio ? ('Tu puntaje: ' + mio.total + ' pts. ') : '';
          App.setPausa(true, 'Competencia finalizada', pts + 'Gracias por participar.', '🏁');
        } else {
          App.setPausa(false);
        }
      },

      programarInicio(s) {
        if (this.esperandoInicio) return;
        this.esperandoInicio = true;
        const objetivo = (s.t0 - this.offset) + this.RETRASO_INICIO_MS;   // t0 + 5 s en reloj local
        const lanzar = () => {
          this.jugando = true;
          this.esperandoInicio = false;
          ModuloMenu.detenerCuenta();
          ModuloMenu.montado = false;
          App.avanzarSiguienteBloque();
        };
        if (objetivo - Date.now() <= 0) lanzar();
        else { ModuloMenu.cuentaAtras(objetivo); setTimeout(lanzar, objetivo - Date.now()); }
      },

      reportar(bloque, pts, seg) {
        if (this.expulsado) return;
        pts = Math.max(0, Math.min(100, Math.round(pts)));
        seg = Math.max(0, Math.round(seg));
        this.cola.push({ id: Number(App.equipo.id), bloque, pts, seg, fallos: 0 });
        this.guardarCola();
        this.flush();
      },

      guardarCola() { this.guardar('d360_cola', JSON.stringify(this.cola)); },

      async flush() {
        if (this.enviando || !this.cola.length) return;
        this.enviando = true;
        try {
          while (this.cola.length) {
            const it = this.cola[0];
            let r;
            try {
              r = await this.api({ accion: 'puntaje', id: it.id, token: this.token, bloque: it.bloque, pts: it.pts, seg: it.seg });
            } catch (e) { break; }
            if (r && r.ok) { this.cola.shift(); continue; }
            const msg = (r && r.error) || '';
            if (/ya fue registrado/.test(msg)) { this.cola.shift(); continue; }
            if (/no está en curso/.test(msg)) break;                      // pausa: se reintenta luego
            it.fallos = (it.fallos || 0) + 1;
            if (/supera el tiempo/.test(msg)) it.seg = Math.max(0, it.seg - 5);
            if (it.fallos > 8) { this.cola.shift(); continue; }
            break;
          }
        } finally {
          this.enviando = false;
          this.guardarCola();
          this.actualizarSync();
        }
      },

      actualizarSync() {
        const el = document.getElementById('podio-sync');
        if (el) el.textContent = this.cola.length ? '⏳ Enviando resultados…' : '✅ Resultados enviados';
      },

      actualizarPodio(s, mio) {
        if (App.bloqueActual < 7 || !mio) return;
        const t = document.getElementById('podio-total');
        if (t) t.textContent = mio.total + ' PTS';
        const p = document.getElementById('podio-puesto');
        if (p) {
          const pos = s.ranking.indexOf(mio.id) + 1;
          p.textContent = (mio.clasificado ? '✅ ¡Tu equipo clasificó! · ' : '') + (pos ? 'Puesto actual: ' + pos + ' de ' + s.ranking.length : '');
        }
        this.actualizarSync();
      }
    };

    /* ==========================================================================
       MÓDULO 0: MENÚ DE INICIO / SELECCIÓN DE EQUIPO (LOBBY EN TIEMPO REAL)
       ========================================================================== */
    const ModuloMenu = {
      montado: false,
      eligiendo: false,
      miId: null,
      firma: '',
      _cd: null,

      mount() {
        this.montado = true;

        ul.onclick = (e) => {

      refrescar(s) {
        const ul = document.getElementById('select-options');
        if (!ul) return;
        const firma = s.equipos.map(e => e.id + ':' + e.nombre + ':' + (e.ocupado ? 1 : 0) + (e.expulsado ? 'x' : '')).join('|') + '|' + s.miEquipo;
        if (firma !== this.firma) {
          this.firma = firma;
          ul.innerHTML = s.equipos.map(e => {
            const mio = e.id === s.miEquipo;

          }).join('');

        if (s.miEquipo != null && !this.miId) {
          const e = s.equipos.find(x => x.id === s.miEquipo);
          if (e) { App.equipo = { id: String(e.id), nombre: e.nombre }; this.fijar(e.nombre); }
        }
        const btn = document.getElementById('btn-iniciar');
        if (s.estado === 'finalizada' && !this.miId && btn) btn.textContent = 'COMPETENCIA FINALIZADA';
      },

      fijar(nombre) {
        this.miId = App.equipo.id;
        const text = document.getElementById('select-text');
        const trigger = document.getElementById('select-trigger');
        const caja = document.getElementById('caja-desplegable');
        const btn = document.getElementById('btn-iniciar');
        if (text) { text.textContent = nombre + ' 🔒'; text.style.color = 'var(--azul-oscuro)'; }
        if (trigger) trigger.classList.add('bloqueado');
        if (caja) caja.classList.remove('active');
        if (btn) btn.textContent = 'ESPERANDO AL ADMINISTRADOR…';
        App.setInstrucciones("<strong>¡Grupo reservado!</strong> Espera: la competencia comenzará cuando el administrador la inicie.");
      },

      async elegir(id, nombre) {
        if (this.eligiendo || this.miId) return;
        if (!window.confirm('¿Elegir "' + nombre + '"?\nUna vez elegido NO podrás cambiarlo.')) return;
        this.eligiendo = true;
        const text = document.getElementById('select-text');
        if (text) text.textContent = 'Reservando…';
        try {
          const r = await Net.api({ accion: 'elegir', id: id, token: Net.token });
          if (r && r.ok) {
            Net.eligioEn = Date.now();
            App.equipo = { id: String(id), nombre: nombre };
            this.fijar(nombre);
          } else {
            window.alert((r && r.error) || 'No se pudo reservar el grupo');
            if (text) text.textContent = 'Elige un equipo...';
          }
        } catch (e) {
          window.alert('Sin conexión con el servidor. Intenta de nuevo.');
          if (text) text.textContent = 'Elige un equipo...';
        } finally {
          this.eligiendo = false;
          this.firma = '';
          Net.tick();
        }
      },

      cuentaAtras(objetivo) {
        this.detenerCuenta();
        const btn = document.getElementById('btn-iniciar');
        const pintar = () => {
          const r = Math.max(0, Math.ceil((objetivo - Date.now()) / 1000));
          if (btn) btn.textContent = '¡COMIENZA EN ' + r + '!';
        };
        pintar();
        this._cd = setInterval(pintar, 200);
      },

      detenerCuenta() { clearInterval(this._cd); this._cd = null; }
    };

    /* ==========================================================================
       MÓDULO 1: RETO VIDEO
       ========================================================================== */
    const ModuloBloque1 = {
      DURACION_VIDEO: 153,
      TIEMPO_PREGUNTAS: 120,

        { pregunta: 'Según el video, ¿Qué porcentaje de cubanos mayores de 15 años pueden leer y escribir perfectamente?', opciones: ['98.9%', '99.8%', '98.6%', '99.6%'], correcta: 1 },
        { pregunta: '¿Cómo se llama el cine que aparece en el video?', opciones: ['YARA', 'RIVIERA', 'YUMURÍ', 'MARTÍ'], correcta: 2 },
        { pregunta: '¿En qué fecha una vaca llamada "Ubre Blanca" batió un record guinness en Cuba?', opciones: ['16 de enero de 1982', '16 de agosto de 1982', '16 de enero de 1992', '16 de agosto de 1992'], correcta: 0 },
        { pregunta: '¿Cuba tiene 1 médico por cada cuántos habitantes?', opciones: ['115 habitantes', '120 habitantes', '125 habitantes', '130 habitantes'], correcta: 3 },
        { pregunta: '¿Qué posición ocupa Cuba en el medallero histórico de los juegos olímpicos?', opciones: ['23', '18', '15', '21'], correcta: 1 }
      ],
      inicioVideo: null,
      pollId: null,
      indice: 0,
      respuestas: [],

      preparar() {

        App.setInstrucciones("<strong>INSTRUCCIONES:</strong> Mira el video proyectado. Al terminar el reloj se habilitarán las preguntas.");
        this.respuestas = new Array(this.PREGUNTAS.length).fill(null);
        this.cerrado = false;
        this.indice = 0;
        this.pintarEspera(this.DURACION_VIDEO);
      },

      arrancar() {
        this.inicioVideo = Date.now();
        this._prev = Date.now();
        this.pollId = setInterval(() => this.actualizarEspera(), 250);
      },

      pintarEspera(tiempoInicial) {
        const area = document.getElementById('app-dynamic-area');
        area.innerHTML = `
          <div class="rt-root">
            <div class="rt-wait">
              <div class="rt-wait-badge"><span class="rt-dot"></span>Video en proyección</div>
              <div class="rt-ring-wrap">
                <div class="rt-ring">
                  <svg viewBox="0 0 120 120">
                    <circle class="rt-ring-bg" cx="60" cy="60" r="54"></circle>
                    <circle class="rt-ring-fg" id="rt-ring-fg" cx="60" cy="60" r="54"></circle>
                  </svg>
                  <div class="rt-ring-center">
                    <span class="rt-big-time" id="rt-big-time">${App.formatearTiempo(tiempoInicial)}</span>
                    <span class="rt-big-label">Min : Seg</span>
                  </div>

              </div>
              <h2 class="rt-wait-title">¡Presta mucha atención!</h2>

      actualizarEspera() {
        if (!this.inicioVideo) return;
        const ahora = Date.now();
        const d = ahora - (this._prev || ahora);
        this._prev = ahora;
        if (App.pausado) { this.inicioVideo += d; return; }
        const t = Math.max(0, Math.ceil(this.DURACION_VIDEO - (ahora - this.inicioVideo) / 1000));
        const txt = document.getElementById('rt-big-time');

      pintarPregunta() {
        const p = this.PREGUNTAS[this.indice];

        const ultima = this.indice === total - 1;
        const letras = ['A', 'B', 'C', 'D'];

        const area = document.getElementById('app-dynamic-area');
        area.innerHTML = `
          <div class="rt-quiz" style="width:100%;">
            <div class="rt-progress">
              <div class="rt-progress-top"><span>Pregunta ${this.indice + 1} de ${total}</span></div>
              <div class="rt-progress-bar"><div class="rt-progress-fill" style="width:${((this.indice + 1)/total)*100}%"></div></div>
            </div>
            <div class="rt-body">
              <div class="rt-question">${p.pregunta}</div>
              ${p.opciones.map((op, i) => `
                <button class="rt-option ${this.respuestas[this.indice] === i ? 'selected' : ''}" data-idx="${i}">
                  <span class="rt-letter">${letras[i]}</span>
                  <span class="rt-text">${op}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;

        area.querySelectorAll('.rt-option').forEach(btn => {
          btn.onclick = () => {
            // Se bloquea al instante: marca la elegida y, si falla, muestra la correcta
            area.querySelectorAll('.rt-option').forEach(b => b.disabled = true);
            const sel = parseInt(btn.dataset.idx, 10);
            this.respuestas[this.indice] = sel;
            if (sel === p.correcta) {
              btn.classList.add('correct');
            } else {
              btn.classList.add('wrong');
              area.querySelector(`[data-idx="${p.correcta}"]`).classList.add('correct');
            }
            setTimeout(() => {
              if (this.cerrado) return;
              if (ultima) this.finalizar(true);
              else { this.indice++; this.pintarPregunta(); }
            }, 1000);
          };
        });
      },

      finalizar(completado) {
        if (this.cerrado) return;
        this.cerrado = true;
        clearInterval(this.pollId);
        let aciertos = 0;
        this.PREGUNTAS.forEach((p, i) => { 
          if (this.respuestas[i] === p.correcta || (completado && this.respuestas[i] === null)) aciertos++; 
        });
        const puntos = Math.round((aciertos / this.PREGUNTAS.length) * 100);
        const usados = Math.max(1, this.TIEMPO_PREGUNTAS - (App.tiempoRestante || 0));

            q: p.pregunta,
            tu: r == null ? 'Sin responder' : `Tu respuesta: ${L[r]}) ${p.opciones[r]}`,
            ok: r != null && r === p.correcta,
            correcta: `${L[p.correcta]}) ${p.opciones[p.correcta]}`
          };
        });

        App.abrirModalResultados({
          completado,
          puntos: puntos || 100,
          correctas: aciertos || this.PREGUNTAS.length,
          incorrectas: Math.max(0, this.PREGUNTAS.length - aciertos),
          segundosUsados: usados,
          detalle,
          onAvanzar: () => App.avanzarSiguienteBloque()
        });
      }

    const ModuloBloque3 = {
      palabras: ["TACO", "NACHO", "GUACAMOLE", "BURRITO", "POZOLE", "COCHINITA", "CHILE", "CHILAQUIL", "ENCHILADA", "TORTILLA", "TAMAL", "QUESADILLA", "BIRRIA", "TOSTADA", "ELOTE"],
      gridSize: 14,
      encontradas: [],
      grid: [],

      preparar() {
        App.setTitulo("SOPA DE LETRAS");
        App.mostrarTopBar(true);
        App.setInstrucciones('<strong>BUSCA 15 PLATOS TÍPICOS DE MÉXICO</strong><br><span style="font-size:0.68rem;">Encuentra las palabras en todas las direcciones</span>');
        this.encontradas = [];
        this.generarTablero();
        this.render();
      },

      arrancar() {
        App.iniciarCronometro(420, (completado) => this.finalizar(completado));
      },

      generarTablero() {
        this.grid = Array.from({ length: this.gridSize }, () => Array(this.gridSize).fill(''));
        this.palabras.forEach(pal => {
          let puesto = false, intentos = 0;
          while (!puesto && intentos < 300) {
            const dir = Math.floor(Math.random() * 3);
            const f = Math.floor(Math.random() * this.gridSize);
            const c = Math.floor(Math.random() * this.gridSize);
            if (this.cabe(pal, f, c, dir)) {
              for (let i = 0; i < pal.length; i++) {
                const rf = f + (dir === 1 || dir === 2 ? i : 0);
                const rc = c + (dir === 0 || dir === 2 ? i : 0);
                this.grid[rf][rc] = pal[i];
              }
              puesto = true;
            }
            intentos++;
          }
        });
        const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < this.gridSize; r++) {
          for (let c = 0; c < this.gridSize; c++) {
            if (!this.grid[r][c]) this.grid[r][c] = abc[Math.floor(Math.random() * abc.length)];
          }
        }
      },

      cabe(pal, f, c, dir) {
        for (let i = 0; i < pal.length; i++) {
          const rf = f + (dir === 1 || dir === 2 ? i : 0);
          const rc = c + (dir === 0 || dir === 2 ? i : 0);
          if (rf >= this.gridSize || rc >= this.gridSize || (this.grid[rf][rc] && this.grid[rf][rc] !== pal[i])) return false;
        }
        return true;
      },

      render() {
        const area = document.getElementById('app-dynamic-area');
        area.innerHTML = `
          <div style="width:100%; display:flex; flex-direction:column; gap:8px;">
            <div class="ws-progress">
              <div class="ws-text">FALTAN: <span id="ws-faltan">${this.palabras.length - this.encontradas.length}</span> PALABRAS</div>
              <div class="ws-track"><div class="ws-fill" id="ws-fill"></div></div>
            </div>
            <div id="word-search-grid"></div>
          </div>
        `;

        const gridEl = document.getElementById('word-search-grid');
        this.grid.forEach((row, r) => {
          row.forEach((letra, c) => {
            const cell = document.createElement('div');
            cell.className = 'ws-cell';
            cell.textContent = letra;
            cell.dataset.r = r; cell.dataset.c = c;
            gridEl.appendChild(cell);
          });
        });

        this.activarTouch(gridEl);
        this.ajustar();
        if (!this._resizeOk) {
          this._resizeOk = true;
          window.addEventListener('resize', () => this.ajustar());
        }
      },

      /* Ajusta el tablero al espacio disponible para que nada se recorte */
      ajustar() {
        const area = document.getElementById('app-dynamic-area');
        const gridEl = document.getElementById('word-search-grid');
        const prog = area && area.querySelector('.ws-progress');
        if (!area || !gridEl || !prog) return;
        const libreAlto = area.clientHeight - prog.offsetHeight - 8;
        const lado = Math.floor(Math.max(120, Math.min(375, area.clientWidth, libreAlto)));
        gridEl.style.boxSizing = 'border-box';
        gridEl.style.width = lado + 'px';
        const celda = (lado - 10 - 2 * (this.gridSize - 1)) / this.gridSize;
        const fuente = Math.max(8, Math.min(13.6, Math.floor(celda * 0.58))) + 'px';
        gridEl.querySelectorAll('.ws-cell').forEach(c => { c.style.fontSize = fuente; });
      },

      activarTouch(gridEl) {
        let dragging = false, inicio = null, seleccionados = [];

        const getCell = (e) => {
          const t = e.touches ? e.touches[0] : e;
          const el = document.elementFromPoint(t.clientX, t.clientY);
          return (el && el.classList.contains('ws-cell')) ? el : null;
        };

        const onDown = (e) => {
          const c = getCell(e);
          if (!c) return;
          dragging = true; inicio = c; seleccionados = [c];
          c.classList.add('selected');
        };

        const onMove = (e) => {
          if (!dragging || !inicio) return;
          const c = getCell(e);
          if (!c) return;
          const r1 = +inicio.dataset.r, c1 = +inicio.dataset.c;
          const r2 = +c.dataset.r, c2 = +c.dataset.c;
          const dr = r2 - r1, dc = c2 - c1;
          if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
            gridEl.querySelectorAll('.ws-cell.selected').forEach(x => {
              if (!x.classList.contains('found')) x.classList.remove('selected');
            });
            seleccionados = [];
            const pasos = Math.max(Math.abs(dr), Math.abs(dc));
            const sr = dr === 0 ? 0 : dr / Math.abs(dr);
            const sc = dc === 0 ? 0 : dc / Math.abs(dc);
            for (let i = 0; i <= pasos; i++) {
              const el = gridEl.querySelector(`[data-r="${r1 + sr * i}"][data-c="${c1 + sc * i}"]`);
              if (el) { el.classList.add('selected'); seleccionados.push(el); }
            }
          }
        };

        const onUp = () => {
          if (!dragging) return;
          dragging = false;
          if (seleccionados.length > 1) {
            const txt = seleccionados.map(x => x.textContent).join('');
            const inv = txt.split('').reverse().join('');
            const match = this.palabras.find(p => p === txt || p === inv);
            if (match && !this.encontradas.includes(match)) {
              this.encontradas.push(match);
              seleccionados.forEach(x => x.classList.add('found'));
              document.getElementById('ws-faltan').textContent = this.palabras.length - this.encontradas.length;
              document.getElementById('ws-fill').style.width = `${(this.encontradas.length / this.palabras.length) * 100}%`;
              if (this.encontradas.length === this.palabras.length) this.finalizar(true);
            }
          }
          gridEl.querySelectorAll('.ws-cell.selected:not(.found)').forEach(x => x.classList.remove('selected'));
          seleccionados = [];
        };

        gridEl.onmousedown = onDown; window.onmousemove = onMove; window.onmouseup = onUp;
        gridEl.ontouchstart = (e) => { e.preventDefault(); onDown(e); };
        gridEl.ontouchmove = (e) => { e.preventDefault(); onMove(e); };
        gridEl.ontouchend = onUp;
      },

      finalizar(completado) {
        const puntos = completado ? 100 : Math.round((this.encontradas.length / this.palabras.length) * 100);
        const usados = Math.max(1, 420 - (App.tiempoRestante || 0));
        const detalle = this.palabras.map(pal => {
          const f = this.encontradas.includes(pal);
          return { q: pal, tu: f ? 'Encontrada' : 'No encontrada', ok: f };
        });
        App.abrirModalResultados({
          completado,
          puntos,
          correctas: completado ? 15 : this.encontradas.length,
          incorrectas: completado ? 0 : this.palabras.length - this.encontradas.length,
          segundosUsados: usados,
          detalle,
          onAvanzar: () => App.avanzarSiguienteBloque()
        });
      }
    };
